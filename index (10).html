<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#0a3b4c">
<title>Arrival Desk — a concept for NEMT dispatch (synthetic data)</title>
<style>
:root{
 --bg:#e9eef1;--paper:#fbfcfd;--ink:#13222c;--muted:#5a6d79;--line:#d2dbe1;--line2:#bfcad2;
 --brand:#0a5c75;--brandDark:#0a3b4c;--brandSoft:#d9ecf2;
 --late:#c9283f;--lateBg:#fde9ec;--risk:#b56a00;--riskBg:#fff1d4;--ok:#1b7d52;--okBg:#dcf2e6;--info:#2a5cc2;--infoBg:#e2eafb;
 --shadow:0 1px 2px rgba(19,34,44,.06),0 8px 24px rgba(19,34,44,.07);
 --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.5 ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
button,input,select,textarea{font:inherit;color:inherit}button{cursor:pointer}
:focus-visible{outline:2px solid var(--brand);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}
header.top{background:var(--brandDark);color:#fff;position:sticky;top:0;z-index:40}
.topIn{max-width:1500px;margin:auto;padding:12px 24px;display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.mark{display:flex;align-items:center;gap:11px;margin-right:auto}
.mark svg{flex:none}
.mark b{font-size:18px;letter-spacing:-.01em;display:block;line-height:1.1}
.mark span{font-size:12px;color:#a9cdd8;display:block}
.clock{display:flex;align-items:baseline;gap:8px;background:rgba(255,255,255,.1);border-radius:10px;padding:7px 13px}
.clock small{font-size:11px;color:#a9cdd8}.clock b{font:700 20px/1 var(--mono);letter-spacing:.02em}
.ctrl{display:flex;gap:7px;flex-wrap:wrap;align-items:center}
.btn{border:1px solid var(--line2);background:var(--paper);color:var(--ink);border-radius:9px;padding:8px 13px;font-weight:650;font-size:13px;transition:background .15s,border-color .15s}
.btn:hover{background:#fff;border-color:var(--brand)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.primary{background:var(--brand);border-color:var(--brand);color:#fff}.btn.primary:hover{background:#0b6e8c}
.btn.sm{padding:5px 10px;font-size:12px}
.btn.warn{background:var(--late);border-color:var(--late);color:#fff}
header.top .btn{background:rgba(255,255,255,.12);border-color:rgba(255,255,255,.28);color:#fff}
header.top .btn:hover{background:rgba(255,255,255,.2)}
header.top .btn.primary{background:#fff;color:var(--brandDark);border-color:#fff}
header.top .btn.primary:hover{background:#e9f4f8}
.select,.input,.textarea{border:1px solid var(--line2);background:#fff;border-radius:9px;padding:8px 10px;outline:none;max-width:100%}
.select:focus,.input:focus,.textarea:focus{border-color:var(--brand)}
header.top .select{background:rgba(255,255,255,.12);border-color:rgba(255,255,255,.28);color:#fff}
header.top .select option{color:#13222c}
.textarea{width:100%;min-height:104px;resize:vertical;line-height:1.5}
.tabs{background:var(--paper);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:30}
.tabsIn{max-width:1500px;margin:auto;padding:0 24px;display:flex;gap:4px;overflow-x:auto}
.tabs button{border:0;background:transparent;padding:13px 14px;font-weight:650;color:var(--muted);border-bottom:3px solid transparent;white-space:nowrap}
.tabs button:hover{color:var(--ink)}.tabs button.on{color:var(--brandDark);border-bottom-color:var(--brand)}
.tabs .badge{display:inline-block;min-width:20px;text-align:center;font-size:11px;font-weight:800;border-radius:10px;padding:1px 6px;margin-left:6px;background:var(--lateBg);color:var(--late)}
.wrap{max-width:1500px;margin:auto;padding:22px 24px 64px}
.tag{display:inline-block;font-size:11px;font-weight:750;border-radius:6px;padding:2px 7px;margin-right:7px}
.tag.pub{background:var(--okBg);color:var(--ok)}.tag.hyp{background:var(--riskBg);color:var(--risk)}.tag.des{background:var(--brandSoft);color:var(--brand)}
.intro{display:flex;gap:16px;align-items:center;justify-content:space-between;background:var(--brandSoft);border:1px solid #b5d6e0;border-radius:12px;padding:13px 16px;margin-bottom:16px;flex-wrap:wrap}
.intro p{margin:0;max-width:900px}
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin-bottom:16px}
.kpi{background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:15px 16px;box-shadow:var(--shadow)}
.kpi .k{font-size:12px;color:var(--muted);font-weight:600}
.kpi .v{font-size:34px;font-weight:800;letter-spacing:-.03em;line-height:1.1;margin:5px 0 3px}
.kpi .n{font-size:12px;color:var(--muted)}
.kpi.bad .v{color:var(--late)}.kpi.good .v{color:var(--ok)}.kpi.watch .v{color:var(--risk)}
.card{background:var(--paper);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);margin-bottom:16px;overflow:hidden}
.card .hd{padding:14px 18px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;gap:12px;align-items:center;flex-wrap:wrap}
.card .hd h2{margin:0;font-size:16px;letter-spacing:-.01em}.card .hd p{margin:2px 0 0;font-size:12.5px;color:var(--muted)}
.pad{padding:16px 18px}
.note{font-size:13px;color:var(--muted);line-height:1.6}.note b{color:var(--ink)}
.chip{display:inline-flex;align-items:center;font-size:12px;font-weight:700;border-radius:20px;padding:2px 9px;white-space:nowrap}
.chip.red{background:var(--lateBg);color:var(--late)}.chip.amber{background:var(--riskBg);color:var(--risk)}.chip.green{background:var(--okBg);color:var(--ok)}.chip.blue{background:var(--infoBg);color:var(--info)}.chip.gray{background:#e6ecef;color:var(--muted)}
/* day board */
.boardScroll{overflow-x:auto}
.board{min-width:880px;position:relative;padding:0 0 6px}
.bRow{display:grid;grid-template-columns:230px 1fr;align-items:center;min-height:34px;border-bottom:1px solid #edf1f3;cursor:pointer}
.bRow:hover{background:#f3f7f9}
.bRow.head{cursor:default;min-height:30px;border-bottom:1px solid var(--line);background:var(--paper)}.bRow.head:hover{background:var(--paper)}
.lab{padding:4px 14px;line-height:1.25;min-width:0}.lab b{display:block;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.lab span{display:block;font-size:11.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lab .dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:6px;background:var(--late)}.lab .dot.amber{background:var(--risk)}
.track{position:relative;height:34px}
.hline{position:absolute;top:0;bottom:0;width:1px;background:#e3eaee}
.tick{position:absolute;top:7px;font:11px var(--mono);color:var(--muted);transform:translateX(-50%)}
.seg{position:absolute;top:7px;height:20px;border-radius:5px;font-size:11px;font-weight:650;line-height:20px;padding:0 7px;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;color:#fff;min-width:74px}
.seg.waiting,.seg.lateTail{min-width:0}
.seg.ok{background:var(--brand)}.seg.transit{background:var(--info)}.seg.done{background:#cfe3d9;color:#2c5b46}
.seg.none{background:repeating-linear-gradient(135deg,#f6d487 0 6px,#fbe6b3 6px 12px);color:#6a4500}
.seg.late{background:var(--late)}
.seg.waiting{background:repeating-linear-gradient(135deg,#f1a1ac 0 6px,#f7c9d0 6px 12px);color:#7a1224}
.seg.lateTail{background:repeating-linear-gradient(135deg,var(--late) 0 5px,#e66a7c 5px 10px);color:#fff}
.seg.idle{background:transparent;border:1px dashed var(--line2);color:var(--muted)}
.nowLine{position:absolute;top:0;bottom:0;width:2px;background:var(--late);z-index:3;pointer-events:none}
.nowLine span{position:absolute;top:-1px;left:4px;background:var(--late);color:#fff;font:700 11px var(--mono);padding:1px 5px;border-radius:4px}
.legend{display:flex;gap:16px;flex-wrap:wrap;padding:11px 18px;font-size:12px;color:var(--muted);border-top:1px solid var(--line)}
.legend i{display:inline-block;width:14px;height:10px;border-radius:3px;margin-right:6px;vertical-align:-1px}
/* case cards */
.sectionTitle{display:flex;justify-content:space-between;align-items:baseline;margin:22px 2px 10px}
.sectionTitle h2{margin:0;font-size:17px;letter-spacing:-.01em}.sectionTitle span{font-size:12.5px;color:var(--muted)}
.cases{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.case{background:var(--paper);border:1px solid var(--line);border-left:6px solid var(--risk);border-radius:12px;padding:15px 17px;box-shadow:var(--shadow);display:grid;gap:9px}
.case.critical{border-left-color:var(--late)}.case.medium{border-left-color:#8aa0ad}.case.fixed{border-left-color:var(--ok)}
.caseTop{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.who{font-size:16px;font-weight:800;letter-spacing:-.01em}
.meta{font-size:12.5px;color:var(--muted);margin-top:1px}
.when{font-size:12px;font-weight:750;border-radius:8px;padding:4px 9px;background:var(--riskBg);color:var(--risk);white-space:nowrap}
.case.critical .when{background:var(--lateBg);color:var(--late)}.case.fixed .when{background:var(--okBg);color:var(--ok)}
.what{font-size:14px}.what b{display:block;font-size:15px}
.stake{font-size:12.5px;color:var(--muted);border-left:3px solid var(--line2);padding-left:10px}
.rec{background:#f1f6f8;border:1px solid var(--line);border-radius:10px;padding:10px 12px;display:grid;gap:8px}
.rec .rl{font-size:12px;color:var(--muted);font-weight:650}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.foot{display:flex;justify-content:space-between;gap:10px;align-items:center;flex-wrap:wrap;font-size:12px;color:var(--muted)}
.empty{text-align:center;padding:38px 18px;color:var(--muted)}
.empty b{display:block;color:var(--ink);font-size:16px;margin-bottom:4px}
/* tables */
.tableWrap{overflow:auto}
table.t{width:100%;border-collapse:collapse;min-width:760px}
.t th{padding:10px 14px;text-align:left;font-size:12px;font-weight:700;color:var(--muted);border-bottom:1px solid var(--line);white-space:nowrap}
.t td{padding:11px 14px;border-bottom:1px solid #edf1f3;vertical-align:top;font-size:13px}
.t b{display:block}.t .sub{display:block;font-size:12px;color:var(--muted);margin-top:1px}
.fields{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px;padding:16px 18px}
.fields label{display:grid;gap:5px;font-size:12px;color:var(--muted)}.fields .input{width:100%}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
.sheet{padding:22px 24px;font-size:14px;line-height:1.65}
.sheet h3{margin:0 0 4px;font-size:20px;letter-spacing:-.01em}.sheet .sub{color:var(--muted);margin-bottom:14px}
.sheet ul{margin:6px 0 0;padding-left:20px}.sheet li{margin:5px 0}
.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin:14px 0}
.stats div{border:1px solid var(--line);border-radius:10px;padding:10px 12px}.stats b{display:block;font-size:24px;letter-spacing:-.02em}.stats span{font-size:12px;color:var(--muted)}
/* drawer */
.overlay{position:fixed;inset:0;background:rgba(10,30,40,.45);z-index:70;opacity:0;pointer-events:none;transition:opacity .2s}.overlay.show{opacity:1;pointer-events:auto}
.drawer{position:fixed;right:0;top:0;width:min(620px,100vw);height:100vh;z-index:200;background:var(--paper);border-left:1px solid var(--line2);box-shadow:none;visibility:hidden;transform:translateX(100%);transition:transform .26s ease,visibility 0s .26s;overflow:auto}
.drawer.open{transform:translateX(0);visibility:visible;box-shadow:-24px 0 60px rgba(10,30,40,.25);transition:transform .26s ease,visibility 0s}
.dHead{position:sticky;top:0;z-index:5;padding:16px 18px;border-bottom:1px solid var(--line);background:var(--paper);display:flex;justify-content:space-between;gap:12px;align-items:flex-start}
.dHead h3{margin:0;font-size:19px;letter-spacing:-.01em}.dHead p{margin:3px 0 0;font-size:13px;color:var(--muted)}
.sec{padding:15px 18px;border-bottom:1px solid var(--line)}.sec h4{margin:0 0 9px;font-size:13px;color:var(--brand)}
.ob{display:grid;gap:7px}.ob div{display:flex;gap:9px;align-items:baseline;font-size:13px}
.ob i{font-style:normal;width:16px;text-align:center;flex:none}.ob .ok i{color:var(--ok)}.ob .miss i{color:var(--late)}.ob .wait i{color:var(--muted)}
.ob small{margin-left:auto;color:var(--muted);white-space:nowrap}.ob .miss small{color:var(--late)}
.tl{display:grid;gap:7px;font-size:13px}.tl div{display:flex;gap:10px}.tl time{flex:none;width:56px;color:var(--muted);font:12px var(--mono);padding-top:2px}.tl .by{font-weight:700;color:var(--brand)}
.box{border:1px solid var(--line);border-radius:11px;padding:12px;background:#f6f9fa;display:grid;gap:8px}
.box label{font-size:12px;color:var(--muted);font-weight:650}
.lock{border:1px solid #e8cf94;background:var(--riskBg);color:#6a4500;border-radius:10px;padding:9px 12px;font-size:12.5px}
.summary{white-space:pre-wrap;font-size:12.5px;line-height:1.6;background:#f6f9fa;border:1px solid var(--line);border-radius:10px;padding:11px}
.toast{position:fixed;right:20px;bottom:20px;z-index:300;opacity:0;transform:translateY(10px);pointer-events:none;transition:.2s;background:var(--brandDark);color:#fff;border-radius:10px;padding:11px 15px;font-size:13px;box-shadow:var(--shadow);max-width:min(440px,calc(100vw - 40px))}
.toast.show{opacity:1;transform:translateY(0)}.toast.err{background:var(--late)}
@media(max-width:1000px){.kpis,.stats{grid-template-columns:repeat(2,minmax(0,1fr))}.cases,.grid2{grid-template-columns:minmax(0,1fr)}.fields{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(max-width:640px){.wrap{padding:16px 12px 48px}.topIn{padding:10px 12px}.tabsIn{padding:0 8px}.fields{grid-template-columns:minmax(0,1fr)}.kpi .v{font-size:28px}.bRow{grid-template-columns:150px 1fr}}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
@media print{body *{visibility:hidden}.sheet,.sheet *{visibility:visible}.sheet{position:absolute;left:0;top:0;width:100%}}
</style>
</head>

/* ---- day board ---- */
var B_START=270,B_END=1050;
function pct(t){return Math.max(0,Math.min(100,(t-B_START)/(B_END-B_START)*100));}
function sortKey(r){if(r.leg==='out')return r.pickup;var e=r.ev.filter(function(x){return x.k==='ready';})[0];return e?e.t:1000;}
function shortFac(f){return f.replace(' Dialysis Center','').replace(' Oncology Clinic','').replace(' Family Clinic','').replace(' Rehab & PT','').replace(' Hospital','');}
function seg(cls,a,b,txt){var l=pct(a),w=Math.max(1.2,pct(b)-pct(a));return '<div class="seg '+cls+'" style="left:'+l+'%;width:'+w+'%" title="'+esc(txt)+'">'+esc(txt)+'</div>';}
function rowSegments(r,st,c){
 var s='',nm=st.driver?DRV[st.driver].name.split(' ')[0]:'';
 if(r.leg==='out'){
  var cls=st.dropoff!=null?'done':st.pickup!=null?'transit':c?'late':!st.driver?'none':'ok';
  var end=r.appt;
  s+=seg(cls,r.pickup,end,st.dropoff!=null?'Arrived '+fmt(st.dropoff):st.pickup!=null?nm+' · en route':!st.driver?'No driver':nm);
  if(st.pickup==null&&S.clock>r.pickup&&c)s+=seg('waiting',r.pickup,Math.min(S.clock,B_END),'Rider waiting');
  if(st.etaPickup&&st.etaPickup+r.travel>r.appt&&st.pickup==null)s+=seg('lateTail',r.appt,st.etaPickup+r.travel,'Arrives '+fmt(st.etaPickup+r.travel));
 }else{
  if(st.ready==null){s+='<div class="seg idle" style="left:2%;width:50%">Waiting for the facility to send patient-ready</div>';}
  else{
   var wEnd=st.pickup!=null?st.pickup:S.clock;
   s+=seg(c?'waiting':'none',st.ready,Math.max(wEnd,st.ready+8),st.pickup!=null?'Waited '+dur(st.pickup-st.ready):'Waiting '+dur(S.clock-st.ready));
   if(st.pickup!=null)s+=seg(st.dropoff!=null?'done':'transit',st.pickup,st.dropoff!=null?st.dropoff:st.pickup+r.travel,st.dropoff!=null?'Home '+fmt(st.dropoff):'Going home · '+nm);
  }
 }
 return s;
}

 '<div class="boardScroll"><div class="board"><div class="bRow head"><div class="lab"><span>Rider</span></div><div class="track">'+ticks+'</div></div>'+(rows||'<div class="empty"><b>No rides with a problem right now.</b>Move the clock to see what the day brings.</div>')+nowL+'</div></div>'+

function reportData(fac){

 var cs=allCases().filter(function(c){return RIDE[c.rideId].fac===fac;});
 var done=0,transit=0,upcoming=0,out_=0,ret_=0;
 rides.forEach(function(r){var st=stOf(r);if(r.leg==='out')out_++;else ret_++;if(st.dropoff!=null)done++;else if(st.pickup!=null)transit++;else upcoming++;});
 var waits=[];cs.forEach(function(c){var m=firstActionMin(S,c);if(m!=null)waits.push(m);});
 var live=cs.filter(function(c){return !c.resolved&&!c.cleared;}),fixed=cs.filter(function(c){return c.cleared||c.resolved;});

  ['Facility visibility','Partner pages promise 24/7 booking, a managed driver network and reporting tools to track trends.','Reporting is probably trend-based. Live visibility with a documented recovery is a natural extension.','Facility view and a self-building arrival report.']
 ].map(function(r){return '<tr><td><b>'+r[0]+'</b></td><td><span class="tag pub">Public</span>'+esc(r[1])+'</td><td><span class="tag hyp">Hypothesis</span>'+esc(r[2])+'</td><td><span class="tag des">This concept</span>'+esc(r[3])+'</td></tr>';}).join('');
 return '<div class="card"><div class="hd"><div><h2>What this is</h2></div></div><div class="pad note">A rides company can lose a facility over a few bad mornings: a wheelchair rider sent a sedan, a dialysis patient who never got a ride, a discharged patient waiting hours for a ride home. Dispatch software tracks the trips. What it often does not do is decide <b>when a late trip becomes a problem, who owns it, and what the facility is told</b>. This concept sits on top of dispatch and does three things: it spots the problem early, it recommends the fix, and it produces the facility report that shows the problem was caught and handled.</div></div>'+
 '<div class="card"><div class="pad note"><b>Independent concept based on publicly available information.</b> Built without access to Kerico systems, data or staff, and not an official Kerico product. Every rider, driver, facility and ride here is synthetic. Public facts come from kericocare.com (booking guide, drivers, customers and services pages). Hypotheses are my inference and may be wrong. Kerico marketing figures are deliberately not used. The "why it matters" lines are general framing, since facility policies differ.</div></div>'+
 '<div class="card"><div class="hd"><div><h2>Public facts, hypotheses and what this concept adds</h2></div></div><div class="tableWrap"><table class="t" style="min-width:980px"><thead><tr><th>Step</th><th>Public</th><th>Hypothesis</th><th>Concept</th></tr></thead><tbody>'+rows+'</tbody></table></div></div>'+
 '<div class="grid2"><div class="card"><div class="hd"><div><h2>Where AI fits, and where it does not</h2></div></div><div class="pad note">Plain rules decide when a problem opens, who owns it and when it escalates. In production a language model could draft the handoff summary and the facility message from the same facts, and a person would read and send every one. AI never reassigns a ride, contacts a rider or closes a case. The summaries here are written by rules, not AI.</div></div>'+
 '<div class="card"><div class="hd"><div><h2>What I would confirm with Kerico</h2></div></div><div class="pad note">How acceptance works in practice (offered or auto-assigned). Which trip status events exist. What a facility is told today when a ride is at risk. How recurring dialysis and will-call returns are handled. What counts as late for each ride type.</div></div></div>'+
 '<div class="note" style="text-align:center;margin-top:8px">Runs on the Continuum exception engine, a workflow engine I built for care operations.</div>';
}

function render(){
 $('clockTxt').textContent=fmt(S.clock);
 $('badge').textContent=liveCases().length;
 document.querySelectorAll('#tabs button').forEach(function(b){b.classList.toggle('on',b.dataset.nav===ui.view);});
 $('view').innerHTML=ui.view==='live'?liveView():ui.view==='facility'?facilityView():ui.view==='rides'?ridesView():ui.view==='rules'?rulesView():ui.view==='audit'?auditView():aboutView();
 if(ui.caseKey||ui.rideKey)renderDrawer();
}

/* ================= drawer ================= */
function summaryText(c,ride,st){
 var acts=S.audit.filter(function(a){return a.caseId===c.id&&a.actor!=='System rule'&&a.t<=S.clock;}).sort(function(a,b){return a.t-b.t||a.n-b.n;}).map(function(a){return '- '+fmt(a.t)+' '+a.actor+': '+a.text;});
 var left=obligations(ride,st,S.T).filter(function(o){return !o.ok;}).map(function(o){return o.l;});
 return RULES[c.rule].name+' ('+c.severity+')\n'+ride.rider+' · '+ride.fac+' · '+ride.type+' · '+ride.mob+(ride.leg==='out'?' · pickup '+fmt(ride.pickup)+', appointment '+fmt(ride.appt):' · return trip')+'\n\nWhat happened: '+c.detail+'\nDriver: '+(st.driver?DRV[st.driver].name+' ('+VEHLABEL[DRV[st.driver].veh]+')':'none')+'\nWith: '+c.owner+(c.escalated?' (escalated: '+c.escReason+')':'')+'\n\nDone so far:\n'+(acts.length?acts.join('\n'):'- nothing yet')+'\n\nStill open: '+(left.length?left.join(', '):'nothing')+'\nFacility told: '+(c.facNotified?fmt(c.facNotified):'not yet')+'\n\nWritten by rules, not AI. A person reviews it before it is used.';
}
function draftFor(c,ride,st){
 var who=ride.rider.replace(' (return)',''),base='Hello '+ride.fac+' team, ';
 var m={
  R1:base+'we need one more detail to finish '+who+'\'s booking and will follow up directly.',
  R2:base+'we are still lining up a driver for '+who+' (pickup '+(ride.pickup!=null?fmt(ride.pickup):'')+'). We are on it and will confirm by '+fmt(S.clock+20)+'. If the appointment can be held or moved, please tell us.',
  R3:base+'we are switching '+who+' to a suitable vehicle so the pickup time does not change. We will confirm shortly.',
  R4:base+'we have not yet confirmed today\'s ride with '+who+'. We are still trying and will tell you if anything changes.',
  R5:base+who+'\'s ride is running late for the '+(ride.pickup!=null?fmt(ride.pickup):'')+' pickup. We are acting on it and will update you by '+fmt(S.clock+15)+'. If their slot can be held, please tell us.',
  R6:base+who+'\'s ride is running behind. We now expect arrival around '+fmt((st.etaPickup||S.clock)+ride.travel)+', after the scheduled time. Can the slot be held?',
  R7:base+who+' was not ready at pickup. We are contacting them and will update you by '+fmt(S.clock+15)+'.',
  R8:base+who+' is waiting for the ride home. We are sending a driver and will update you by '+fmt(S.clock+15)+'.'
 };
 return (m[c.rule]||base+'we are looking into '+who+'\'s ride.')+'\n\n— '+ui.role+' (draft)';
}
function evText(e,ride){
 var dn=e.d&&DRV[e.d]?DRV[e.d].name:'';
 switch(e.k){
  case 'accept':return dn+' took the ride';case 'decline':return dn+' declined the ride';case 'confirm':return 'Rider or caregiver confirmed';
  case 'enroute':return 'Driver on the way';case 'eta':return 'ETA to pickup '+fmt(e.v);case 'arrive':return 'Driver arrived at pickup';
  case 'pickup':return 'Rider picked up';case 'dropoff':return ride.leg==='out'?'Rider arrived at the facility':'Rider dropped off at home';
  case 'notready':return 'Driver says the rider is not ready';case 'rider_ready':return 'Rider is at the door';case 'ready':return 'Facility sent patient-ready';
  case 'fields':return 'Booking details completed';case 'call':return e.o==='reached'?'Rider contacted':'Rider call, no answer';
  case 'dcall':return 'Driver call, no answer';case 'fnotify':return 'Facility told';default:return e.k;}
}
function obHTML(ride,st){
 return obligations(ride,st,S.T).map(function(o){
  var cls=o.ok?'ok':(o.due!=null&&o.due<=S.clock?'miss':'wait');
  var small=o.ok?(o.at!=null?fmt(o.at):''):(o.due!=null?(cls==='miss'?'overdue, due ':'due ')+fmt(o.due):'');
  return '<div class="'+cls+'"><i>'+(o.ok?'✓':cls==='miss'?'✕':'○')+'</i><span>'+esc(o.l)+'</span><small>'+small+'</small></div>';}).join('');
}
function renderDrawer(){
 var c=ui.caseKey?S.cases[ui.caseKey]:null;
 if(ui.caseKey&&!c){closeDrawer();return;}
 var ride=c?RIDE[c.rideId]:RIDE[ui.rideKey],st=stOf(ride);
 var evTl=st.events.slice(-8).map(function(e){return '<div><time>'+fmt(e.t).replace('Yesterday ','Yday ')+'</time><span>'+esc(evText(e,ride))+'</span></div>';}).join('');
 var html='';
 if(!c){
  var cs=allCases().filter(function(x){return x.rideId===ride.id;});
  html='<div class="dHead"><div><h3>'+esc(ride.rider)+'</h3><p>'+esc(ride.fac)+' · '+esc(ride.type)+' · '+esc(ride.mob)+(ride.leg==='out'?' · pickup '+fmt(ride.pickup)+', appointment '+fmt(ride.appt):' · return trip')+'</p></div><button class="btn" data-act="closeDrawer">Close</button></div>'+
  '<div class="sec"><h4>Deadlines for this ride</h4><div class="ob">'+obHTML(ride,st)+'</div></div>'+
  (cs.length?'<div class="sec"><h4>Problems on this ride</h4>'+cs.map(function(x){return '<div class="row" style="margin-bottom:6px"><b>'+esc(RULES[x.rule].name)+'</b>'+(x.resolved?'<span class="chip green">Closed</span>':x.cleared?'<span class="chip blue">Fixed</span>':sevChip(x.severity))+'<button class="btn sm" data-act="open" data-k="'+esc(x.key)+'">Open</button></div>';}).join('')+'</div>':'<div class="sec"><div class="note">No problems on this ride.</div></div>')+
  '<div class="sec"><h4>Latest events</h4><div class="tl">'+(evTl||'<div><span>No events yet.</span></div>')+'</div></div>';
  $('drawer').innerHTML=html;
 }else{
  var rec=recommend(S,c,ride,st,S.clock),acting=canAct(c)&&!c.resolved,dis=acting?'':' disabled';
  if(ui.draftFor!==c.key){ui.draft=draftFor(c,ride,st);ui.draftFor=c.key;}
  var facImpact=RULES[c.rule].fac==='Yes';
  var caseLog=S.audit.filter(function(a){return a.caseId===c.id&&a.t<=S.clock;}).sort(function(a,b){return a.t-b.t||a.n-b.n;}).map(function(a){return '<div><time>'+fmt(a.t)+'</time><span><span class="by">'+esc(a.actor)+'</span> '+esc(a.text)+'</span></div>';}).join('');
  var evid=(c.evid||[]).map(function(e){return '<div class="'+(e.ok?'ok':'miss')+'"><i>'+(e.ok?'✓':'✕')+'</i><span>'+esc(e.l)+'</span></div>';}).join('');
  var sugO=c.resolved?'':suggestOutcome(S,c),sugR=suggestReason(c);
  var roleNote=(!acting&&!c.resolved)?'<div class="lock">'+(ui.role==='Facility coordinator'?'The facility role can watch but not act.':'This case is now with the Ops manager.')+' <button class="btn sm" data-act="role" data-role="Ops manager" style="margin-left:6px">Switch to Ops manager</button></div>':'';
  var resolvedBox=c.resolved?'<div class="sec"><h4>How it ended</h4><div class="note"><b>'+esc(c.resolved.outcome)+'</b> · '+esc(c.resolved.reason)+(c.resolved.note?'<br>'+esc(c.resolved.note):'')+'<br>Closed by '+esc(c.resolved.by)+' at '+fmt(c.resolved.t)+'.</div></div>':'';
  var elig=DRIVERS.map(function(d){var reason='';if(RANK[d.veh]<RANK[ride.mob])reason='wrong vehicle';else{var b=driverBusy(S,S.clock,ride,d.id);if(b)reason='busy with '+b;}if(st.driver===d.id&&!reason)reason='current driver';return {d:d,reason:reason};});
  var free=elig.filter(function(x){return !x.reason;});
  var showAssign=['R2','R3','R5','R6','R8'].indexOf(c.rule)>-1;
  var asgSel=showAssign?'<div class="box"><label>Choose a different driver</label><div class="row"><select class="select" id="asg" aria-label="Driver">'+elig.map(function(x){return '<option value="'+x.d.id+'"'+(x.reason?' disabled':'')+(rec.kind==='assign'&&rec.d.id===x.d.id?' selected':'')+'>'+esc(x.d.name+' · '+VEHLABEL[x.d.veh]+(x.reason?' ('+x.reason+')':''))+'</option>';}).join('')+'</select><button class="btn" data-act="assignSel" data-k="'+esc(c.key)+'"'+(acting&&free.length?'':' disabled')+'>Assign</button></div></div>':'';
  html='<div class="dHead"><div><h3>'+esc(RULES[c.rule].name)+'</h3><p>'+esc(ride.rider)+' · '+esc(ride.fac)+' · '+esc(ride.type)+'</p><div class="row" style="margin-top:8px">'+(c.resolved?'<span class="chip green">Closed</span>':c.cleared?'<span class="chip blue">Fixed</span>':sevChip(c.severity))+(c.escalated?'<span class="chip red">Escalated</span>':'')+'<span class="chip gray">'+esc(c.owner)+'</span></div></div><button class="btn" data-act="closeDrawer">Close</button></div>'+
  '<div class="sec"><h4>What happened</h4><div class="note" style="margin-bottom:8px;color:var(--ink)">'+esc(c.detail)+'</div><div class="ob">'+evid+'</div><div class="stake" style="margin-top:10px">'+esc(STAKE[ride.type]||'')+'</div><div class="note" style="margin-top:8px">Opened '+fmt(c.createdAt)+'. '+ownerLine(c).replace(/&amp;/g,'&')+'</div></div>'+
  resolvedBox+
  (c.resolved?'':'<div class="sec"><h4>Fix it</h4>'+roleNote+'<div class="box"><label>'+(rec.kind==='none'?'What to do':'Recommended')+'</label><div>'+esc(rec.label)+'</div>'+(rec.kind==='none'?'':quickButtons(c,ride,st,rec))+'</div>'+asgSel+'</div>')+
  (c.resolved||!facImpact?'':'<div class="sec"><h4>Tell the facility</h4><div class="box"><label>Draft (a person reads it and sends it)</label><textarea class="textarea" id="draft" aria-label="Message to facility"'+dis+'>'+esc(ui.draft)+'</textarea><div class="row"><button class="btn" data-act="notify" data-k="'+esc(c.key)+'"'+((c.facNotified||!acting)?' disabled':'')+'>'+(c.facNotified?'Sent '+fmt(c.facNotified):'Send (demo, nothing leaves this page)')+'</button></div></div></div>')+
  (c.resolved?'':'<div class="sec"><h4>Close it</h4><div class="box"><label>Outcome and reason (suggested from what happened)</label><div class="row"><select class="select" id="oc" aria-label="Outcome"><option value="">Outcome…</option>'+OUTCOMES.map(function(o){return '<option'+(o===sugO?' selected':'')+'>'+esc(o)+'</option>';}).join('')+'</select><select class="select" id="rs" aria-label="Reason"><option value="">Reason…</option>'+REASONS.map(function(o){return '<option'+(o===sugR?' selected':'')+'>'+esc(o)+'</option>';}).join('')+'</select></div><input class="input" id="nt" placeholder="Note (optional)" aria-label="Note"><div class="row"><button class="btn primary" data-act="resolve" data-k="'+esc(c.key)+'"'+dis+'>Close case</button></div><div class="note">Closing needs an outcome and a reason. Outcomes that hurt the appointment also need the facility told first.</div></div></div>')+
  '<div class="sec"><h4>Ride deadlines</h4><div class="ob">'+obHTML(ride,st)+'</div></div>'+
  '<div class="sec"><h4>Handoff summary</h4><div class="summary" id="sumTxt">'+esc(summaryText(c,ride,st))+'</div><div class="row" style="margin-top:8px"><button class="btn sm" data-act="copySummary">Copy summary</button></div></div>'+
  '<div class="sec"><h4>Case history</h4><div class="tl">'+(caseLog||'<div><span>No entries yet.</span></div>')+'</div></div>'+
  '<div class="sec"><h4>Latest ride events</h4><div class="tl">'+(evTl||'<div><span>No events yet.</span></div>')+'</div></div>';
  $('drawer').innerHTML=html;
 }
 $('drawer').classList.add('open');$('drawer').setAttribute('aria-hidden','false');$('overlay').classList.add('show');
}
function closeDrawer(){ui.caseKey=null;ui.rideKey=null;ui.draftFor=null;$('drawer').classList.remove('open');$('drawer').setAttribute('aria-hidden','true');$('overlay').classList.remove('show');}

/* ================= actions ================= */
function afterAction(){evaluate(S,S.clock);save();render();}
function takeOwnership(c){if(c.ack)return;c.ack=S.clock;c.ackBy=ui.role;if(ui.role==='Ops manager')c.owner='Ops manager';log(S,S.clock,ui.role,c,'Took ownership.');}
function guard(c){
 if(c.resolved){toast('This case is already closed.',true);return false;}
 if(ui.role==='Facility coordinator'){toast('The facility role can watch but not act.',true);return false;}
 if(!canAct(c)){toast('This case is with the Ops manager. Switch role to act on it.',true);return false;}
 return true;
}
function doAssign(c,d){
 var ride=RIDE[c.rideId],now=S.clock;if(!guard(c))return;
 if(!d){toast('Choose a driver.',true);return;}
 takeOwnership(c);addHuman(S,ride.id,assignEvents(ride,d,now,S.T),now);
 log(S,now,ui.role,c,'Sent '+DRV[d].name+' ('+VEHLABEL[DRV[d].veh]+').');afterAction();toast(DRV[d].name+' is on it. Move the clock to watch the ride play out.');
}
function doDriverCall(c,o){
 var ride=RIDE[c.rideId],now=S.clock;if(!guard(c))return;takeOwnership(c);
 if(o==='dNone'){addHuman(S,ride.id,[E(now,'dcall',{o:'none',human:1})],null);log(S,now,ui.role,c,'Called the driver, no answer.');}
 else{var v=o==='dOn'?Math.max(now+8,ride.pickup):now+25;addHuman(S,ride.id,[E(now,'enroute',{human:1}),E(now,'eta',{v:v}),E(v+1,'pickup'),E(v+1+ride.travel,'dropoff')],now);log(S,now,ui.role,c,'Driver confirmed on the way'+(o==='dLate'?', about 25 minutes late':', on time')+'. New ETA '+fmt(v)+'.');}
 afterAction();
}
function doRiderCall(c,o){
 var ride=RIDE[c.rideId],now=S.clock;if(!guard(c))return;takeOwnership(c);
 if(o==='rNone'){addHuman(S,ride.id,[E(now,'call',{o:'none',human:1})],null);log(S,now,ui.role,c,'Called the rider or caregiver, no answer.');}
 else if(c.rule==='R7'){addHuman(S,ride.id,[E(now,'call',{o:'reached',human:1}),E(now+3,'rider_ready'),E(now+8,'pickup'),E(now+8+ride.travel,'dropoff')],now);log(S,now,ui.role,c,'Reached the rider. They are coming out and the driver will load them.');}
 else{addHuman(S,ride.id,[E(now,'call',{o:'reached',human:1})],null);log(S,now,ui.role,c,'Reached the rider or caregiver. Ride confirmed.');}
 afterAction();
}
function doFields(c){var ride=RIDE[c.rideId];if(!guard(c))return;takeOwnership(c);addHuman(S,ride.id,[E(S.clock,'fields',{human:1})],null);log(S,S.clock,ui.role,c,'Confirmed the return plan with the booker.');afterAction();}
function doNotify(c){
 var ride=RIDE[c.rideId],now=S.clock;if(!guard(c))return;
 var ta=$('draft'),msg=ta?ta.value.trim():'';if(!msg){toast('The message is empty.',true);return;}
 takeOwnership(c);addHuman(S,ride.id,[E(now,'fnotify',{human:1})],null);c.facNotified=now;
 log(S,now,ui.role,c,'Told '+ride.fac+' (demo, not actually sent).');afterAction();toast('Logged as sent to '+ride.fac+'. Nothing leaves this demo.');
}
function doResolve(c,oc,rs,nt){
 var now=S.clock;if(!guard(c))return;
 if(!oc||!rs){toast('Choose an outcome and a reason.',true);return;}
 if(NEEDS_FAC.indexOf(oc)>-1&&!c.facNotified){toast('Tell the facility first. This outcome affected their appointment.',true);return;}
 if(!c.cleared&&NEEDS_CLEARED.indexOf(oc)>-1){toast('The problem is still active. Fix it first, or choose Rider no-show, Cancelled or Missed ride.',true);return;}
 takeOwnership(c);c.resolved={t:now,outcome:oc,reason:rs,note:nt||'',by:ui.role};
 log(S,now,ui.role,c,'Closed: '+oc+' ('+rs+')'+(nt?'. '+nt:'.'));afterAction();toast('Closed as '+oc+'.');
}
function act(name,el){
 var k=el.dataset.k,c=k?S.cases[k]:null;
 switch(name){
  case 'closeDrawer':closeDrawer();return;
  case 'open':ui.caseKey=k;ui.rideKey=null;ui.draftFor=null;renderDrawer();return;
  case 'role':ui.role=el.dataset.role;$('role').value=ui.role;render();return;
  case 'introOff':S.introOff=1;save();render();return;
  case 'q':{var q=el.dataset.q;if(!c)return;
   if(q==='assign')doAssign(c,el.dataset.d);
   else if(q==='dOn'||q==='dLate'||q==='dNone')doDriverCall(c,q);
   else if(q==='rYes'||q==='rNone')doRiderCall(c,q);
   else if(q==='fields')doFields(c);
   else if(q==='close')doResolve(c,suggestOutcome(S,c),suggestReason(c),'');
   return;}
  case 'assignSel':if(c)doAssign(c,$('asg').value);return;
  case 'notify':if(c)doNotify(c);return;
  case 'resolve':if(c)doResolve(c,$('oc').value,$('rs').value,($('nt').value||'').trim());return;
  case 'resetT':S.T=JSON.parse(JSON.stringify(DEFAULT_T));afterAction();toast('Thresholds restored.');return;
  case 'facReady':{var r=RIDE[el.dataset.ride];addHuman(S,r.id,[E(S.clock,'ready',{human:1})],S.clock);log(S,S.clock,'Facility coordinator',null,'Sent patient-ready for '+r.rider+'.',r.id);afterAction();toast('Patient-ready sent for '+r.rider+'.');return;}
  case 'copySummary':{var txt=$('sumTxt').textContent;copyText(txt);return;}
  case 'copyReport':copyText(reportText(ui.fac));return;
  case 'print':window.print();return;
  case 'exportAudit':{var blob=new Blob([JSON.stringify(S.audit.filter(function(a){return a.t<=S.clock;}),null,2)],{type:'application/json'});var a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='arrival-desk-history.json';document.body.appendChild(a);a.click();a.remove();return;}
 }
}
function copyText(t){if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(t).then(function(){toast('Copied.');},function(){toast('Copy failed. Select the text and copy it.',true);});}else toast('Copy is not available here. Select the text and copy it.',true);}

/* ================= wiring ================= */
document.addEventListener('click',function(ev){
 var n=ev.target.closest('[data-nav]');if(n){ui.view=n.dataset.nav;closeDrawer();render();return;}
 var a=ev.target.closest('[data-act]');if(a){act(a.dataset.act,a);return;}
 var r=ev.target.closest('[data-ride]');if(r&&!ev.target.closest('button')){var rid=r.dataset.ride,cs=caseOfRide(rid);if(cs){ui.caseKey=cs.key;ui.rideKey=null;}else{ui.rideKey=rid;ui.caseKey=null;}ui.draftFor=null;renderDrawer();return;}
 if(ev.target.id==='overlay')closeDrawer();
});
document.addEventListener('keydown',function(ev){
 if(ev.key==='Escape'&&(ui.caseKey||ui.rideKey))closeDrawer();
 if((ev.key==='Enter'||ev.key===' ')&&ev.target.matches&&ev.target.matches('.bRow[data-ride]')){ev.preventDefault();ev.target.click();}
});
document.addEventListener('input',function(ev){if(ev.target.id==='draft')ui.draft=ev.target.value;});
document.addEventListener('change',function(ev){
 var t=ev.target;
 if(t.id==='facSel'){ui.fac=t.value;render();}
 else if(t.id==='onlyProblems'){ui.problemsOnly=t.checked;render();}
 else if(t.dataset&&t.dataset.t){var v=parseFloat(t.value);if(isNaN(v)||v<0){toast('Enter a number of zero or more.',true);render();return;}S.T[t.dataset.t]=v;evaluate(S,S.clock);save();render();toast('Updated. The day was re-checked.');}
});
$('role').addEventListener('change',function(){ui.role=this.value;render();});
$('reset').addEventListener('click',function(){S=freshState();evaluate(S,DAY_START);ui.caseKey=null;ui.rideKey=null;save();closeDrawer();render();toast('Day reset to 05:00.');});
function step(mins,stop){if(S.clock>=DAY_END){toast('End of the demo day. Press Reset day to start again.');return;}var found=advance(S,Math.min(S.clock+mins,DAY_END),stop);save();render();return found;}
$('btn30').addEventListener('click',function(){step(30,false);});
$('btn120').addEventListener('click',function(){step(120,false);});
$('btnNext').addEventListener('click',function(){
 if(S.clock>=DAY_END){toast('End of the demo day. Press Reset day to start again.');return;}
 var found=advance(S,DAY_END,true);save();render();
 toast(found?'Moved to '+fmt(S.clock)+'. A new problem opened.':'No further problems today.');
});
render();
window.__ride={S:function(){return S;},advance:advance,evaluate:evaluate};
})();
</script>
